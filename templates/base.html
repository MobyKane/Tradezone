<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}TradeZone{% endblock %}</title>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "primary": "#0059bb",
                "outline": "#717786",
                "on-background": "#1c1b1b",
                "surface-variant": "#e5e2e1",
                "on-surface": "#1c1b1b",
                "surface-container-low": "#f6f3f2",
                "surface-dim": "#dcd9d9",
                "inverse-primary": "#adc7ff",
                "on-secondary": "#ffffff",
                "on-primary-container": "#fefcff",
                "on-primary": "#ffffff",
                "secondary": "#9f4200",
                "outline-variant": "#c1c6d7",
                "surface": "#fcf9f8",
                "inverse-surface": "#313030",
                "background": "#fcf9f8",
                "surface-bright": "#fcf9f8",
                "tertiary-fixed": "#69ff87",
                "secondary-fixed-dim": "#ffb692",
                "primary-container": "#0070ea",
                "secondary-fixed": "#ffdbcb",
                "primary-fixed-dim": "#adc7ff",
                "on-error-container": "#93000a",
                "surface-tint": "#005bc0",
                "inverse-on-surface": "#f3f0ef",
                "secondary-container": "#fd6c00",
                "surface-container-highest": "#e5e2e1",
                "surface-container-high": "#ebe7e7",
                "tertiary-container": "#008735",
                "on-secondary-fixed-variant": "#7a3000",
                "on-tertiary-container": "#f7fff2",
                "tertiary": "#006b29",
                "on-secondary-container": "#562000",
                "on-tertiary-fixed": "#002108",
                "on-error": "#ffffff",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-fixed-variant": "#00531e",
                "primary-fixed": "#d8e2ff",
                "on-primary-fixed-variant": "#004493",
                "on-secondary-fixed": "#341100",
                "error": "#ba1a1a",
                "tertiary-fixed-dim": "#3ce36a",
                "on-tertiary": "#ffffff",
                "on-surface-variant": "#414754",
                "error-container": "#ffdad6",
                "surface-container": "#f0edec",
                "on-primary-fixed": "#001a41"
              },
              "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
              },
              "spacing": {
                "xs": "4px",
                "md": "16px",
                "lg": "24px",
                "base": "4px",
                "xl": "40px",
                "margin-desktop": "64px",
                "margin-mobile": "16px",
                "gutter": "20px",
                "sm": "8px"
              },
              "fontFamily": {
                "title-lg": ["Inter"],
                "label-md": ["Inter"],
                "headline-md": ["Poppins"],
                "button": ["Inter"],
                "headline-lg": ["Poppins"],
                "headline-lg-mobile": ["Poppins"],
                "display-lg": ["Poppins"],
                "body-md": ["Inter"],
                "body-lg": ["Inter"]
              },
              "fontSize": {
                "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                "button": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                "display-lg": ["48px", { "lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
              }
            }
          }
        };
    </script>
</head>
<body class="bg-background text-on-background font-body-md antialiased pb-[80px] md:pb-0">
    <!-- TopAppBar -->
    <header class="docked full-width top-0 sticky z-50 bg-surface dark:bg-inverse-surface shadow-sm dark:shadow-none flex justify-between items-center px-margin-mobile md:px-margin-desktop py-md w-full">
        <button aria-label="Menu" class="text-primary dark:text-inverse-primary hover:bg-surface-variant dark:hover:bg-on-surface-variant p-2 rounded-full transition-colors duration-200">
            <span class="material-symbols-outlined" data-icon="menu">menu</span>
        </button>
        <div class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary text-3xl" data-icon="shopping_bag">shopping_bag</span>
            <span>TradeZone</span>
        </div>
        <button aria-label="Cart" class="text-primary dark:text-inverse-primary hover:bg-surface-variant dark:hover:bg-on-surface-variant p-2 rounded-full transition-colors duration-200">
            <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
        </button>
    </header>
    <main class="max-w-[1440px] mx-auto px-margin-mobile md:px-margin-desktop py-lg space-y-xl">
        {% block content %}
        {% endblock %}
    </main>
    <!-- BottomNavBar (Mobile Only) -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-outline pb-safe pt-2 shadow-lg dark:shadow-none hidden md:hidden shadow-[0px_-4px_20px_rgba(0,0,0,0.05)]" style="display: flex;">
        <!-- Home -->
        <a class="flex flex-col items-center justify-center bg-primary-container dark:bg-secondary text-on-primary-container dark:text-on-secondary rounded-2xl px-4 py-1 scale-95 active:scale-90 transition-transform" href="{% url 'home' %}">
            <span class="material-symbols-outlined" data-icon="home" data-weight="fill">home</span>
            <span class="font-label-md text-label-md mt-1">Home</span>
        </a>
        <!-- Categories (List Items) -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary scale-95 active:scale-90 transition-transform" href="{% url 'list_item' %}">
            <span class="material-symbols-outlined" data-icon="category">category</span>
            <span class="font-label-md text-label-md mt-1">Categories</span>
        </a>
        <!-- Sell (Product Detail) -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary scale-95 active:scale-90 transition-transform" href="{% url 'product_detail' %}">
            <span class="material-symbols-outlined" data-icon="add_box">add_box</span>
            <span class="font-label-md text-label-md mt-1">Sell</span>
        </a>
        <!-- Cart (Checkout) -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary scale-95 active:scale-90 transition-transform relative" href="{% url 'checkout' %}">
            <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
            <span class="font-label-md text-label-md mt-1">Cart</span>
            <span class="absolute top-1 right-2 w-2 h-2 bg-secondary rounded-full"></span>
        </a>
        <!-- Profile -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary scale-95 active:scale-90 transition-transform" href="#">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-label-md text-label-md mt-1">Profile</span>
        </a>
        <!-- Developer Portfolio -->
        <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 active:scale-90 transition-transform" href="https://github.com/MobyKane/Antigravity-portfolio" target="_blank">
            <span class="material-symbols-outlined">code</span>
            <span class="font-label-md text-label-md mt-1">Portfolio</span>
        </a>
    </nav>
</body>
</html>
